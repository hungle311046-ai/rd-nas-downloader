[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rd-nas-downloader"
version = "0.1.0"
description = "Real-Debrid to NAS downloader — paste magnet, files land on NAS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]
